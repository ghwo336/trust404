[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "baybench"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6",
    "jsonschema>=4.20",
    "click>=8.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
detector = ["slither-analyzer==0.11.6", "solc-select>=1.0"]

[project.scripts]
bench = "baybench.cli:main"

[tool.setuptools.packages.find]
include = ["baybench*"]

[tool.setuptools.package-data]
baybench = ["schema/*.json", "catalog.yaml", "tools.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
